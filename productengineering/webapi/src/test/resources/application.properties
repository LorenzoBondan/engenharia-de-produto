spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.open-in-view=false

security.client-id=${CLIENT_ID:myclientid}
security.client-secret=${CLIENT_SECRET:myclientsecret}

security.jwt.duration=${JWT_DURATION:86400}

cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc.swagger-ui.path=/swagger-ui-custom.html

todeschini.users.admin.email=${ADMIN_EMAIL:maria@gmail.com}
todeschini.users.admin.password=${ADMIN_PASSWORD:123456}
todeschini.users.analyst.email=${READ_ONLY_EMAIL:bob@gmail.com}
todeschini.users.analyst.password=${READ_ONLY_PASSWORD:123456}
todeschini.users.operator.email=${READ_ONLY_EMAIL:alex@gmail.com}
todeschini.users.operator.password=${READ_ONLY_PASSWORD:123456}

spring.main.allow-bean-definition-overriding=true